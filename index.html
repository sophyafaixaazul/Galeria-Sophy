<!DOCTYPE html>
    <html lang="pt-BR">
        <head>

            <title>Sophy ;)</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="style-index.css">
            <meta name="author" content="Sophy">
            <link rel="icon" href="icon1.jpg" type="image/jpg">

         </head>

        <body>

            <header>

                <div class="header"></div>
                <div class="banner"></div> <br>
                <div class="sophya"><img src="perfil-pic.jpg" alt="Foto de perfil"></div> <br>
                <h1> Sophya Ferreiro ♱ </h1> </div>

            </header>

            <main>

             <div class="galeria">

             <div class="foto-item">

                 <input class="foto-toggle" type="checkbox" id="abrir-foto1">
                 <label class="abrir-foto" for="abrir-foto1"><img src="img1.jpg" alt="foto1"></label>

                 <div class="foto-ampliada">

                     <label class="fechar-foto" for="abrir-foto1" aria-label="Fechar foto">&times;</label>
                     <img src="img1.jpg" alt="foto1 ampliada">

                 </div>

             </div>

             <div class="foto-item">

                 <input class="foto-toggle" type="checkbox" id="abrir-foto2">
                 <label class="abrir-foto" for="abrir-foto2"><img src="img2.jpg" alt="foto2"></label>

                 <div class="foto-ampliada">

                     <label class="fechar-foto" for="abrir-foto2" aria-label="Fechar foto">&times;</label>
                     <img src="img2.jpg" alt="foto2 ampliada">

                 </div>

             </div>

             <div class="foto-item">

                 <input class="foto-toggle" type="checkbox" id="abrir-foto3">
                 <label class="abrir-foto" for="abrir-foto3"><img src="img3.jpg" alt="foto3"></label>

                 <div class="foto-ampliada">

                     <label class="fechar-foto" for="abrir-foto3" aria-label="Fechar foto">&times;</label>
                     <img src="img3.jpg" alt="foto3 ampliada">

                 </div>

             </div>

             <div class="foto-item">

                 <input class="foto-toggle" type="checkbox" id="abrir-foto4">
                 <label class="abrir-foto" for="abrir-foto4"><img src="img4.jpg" alt="foto4"></label>

                 <div class="foto-ampliada">

                     <label class="fechar-foto" for="abrir-foto4" aria-label="Fechar foto">&times;</label>
                     <img src="img4.jpg" alt="foto4 ampliada">

                 </div>

             </div>

             <div class="foto-item">

                 <input class="foto-toggle" type="checkbox" id="abrir-foto5">
                 <label class="abrir-foto" for="abrir-foto5"><img src="img5.jpg" alt="foto5"></label>

                 <div class="foto-ampliada">

                     <label class="fechar-foto" for="abrir-foto5" aria-label="Fechar foto">&times;</label>
                     <img src="img5.jpg" alt="foto5 ampliada">

                 </div>

             </div> 

            </main>

        </body>

</html>
